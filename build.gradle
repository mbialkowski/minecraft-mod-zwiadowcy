plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    // np. zwiadowcy-forge-1.20.1-1.0.0.jar - wersja Minecrafta i loader od razu widoczne w nazwie pliku
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            // gradlew runServer -Pselftest=true  → autotest danych fabularnych (raport w run/selftest.txt)
            property 'zwiadowcy.selftest', project.findProperty('selftest') ?: 'false'
            args '--nogui'
        }
    }
}

// Generatory tekstur (pixel-art) i struktur (.nbt) - czysta Java, bez zależności od Minecrafta.
sourceSets {
    assetgen {
        java { srcDir 'tools/assetgen/java' }
    }
}

tasks.register('generateTextures', JavaExec) {
    group = 'zwiadowcy'
    description = 'Generuje tekstury pixel-art do src/main/resources/assets/zwiadowcy/textures'
    classpath = sourceSets.assetgen.runtimeClasspath
    mainClass = 'pl.zwiadowcy.assetgen.TextureGen'
    jvmArgs '-Djava.awt.headless=true'
    args file('src/main/resources/assets/zwiadowcy/textures').absolutePath
}

tasks.register('generateStructures', JavaExec) {
    group = 'zwiadowcy'
    description = 'Generuje struktury fabularne (.nbt) do src/main/resources/data/zwiadowcy/structures'
    classpath = sourceSets.assetgen.runtimeClasspath
    mainClass = 'pl.zwiadowcy.assetgen.StructureGen'
    args file('src/main/resources/data/zwiadowcy/structures').absolutePath
}

tasks.register('generateBiomes', JavaExec) {
    group = 'zwiadowcy'
    description = 'Generuje biomy Araluenu i ustawienia szumu na bazie danych vanilla (client-extra.jar)'
    classpath = sourceSets.assetgen.runtimeClasspath
    mainClass = 'pl.zwiadowcy.assetgen.BiomeGen'
    args "${System.getProperty('user.home')}/.gradle/caches/forge_gradle/minecraft_repo/versions/${minecraft_version}/client-extra.jar",
            file('src/main/resources/data').absolutePath
}

tasks.register('generatePromo', JavaExec) {
    group = 'zwiadowcy'
    description = 'Generuje ikonę i baner do publikacji (publikacja/) oraz logo na liście modów (logo.png)'
    classpath = sourceSets.assetgen.runtimeClasspath
    mainClass = 'pl.zwiadowcy.assetgen.PromoGen'
    jvmArgs '-Djava.awt.headless=true'
    args file('publikacja').absolutePath, file('src/main/resources').absolutePath
}

tasks.register('generateAssets') {
    group = 'zwiadowcy'
    description = 'Uruchamia wszystkie generatory'
    dependsOn 'generateTextures', 'generateStructures', 'generateBiomes', 'generatePromo'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    assetgenImplementation 'com.google.code.gson:gson:2.10.1'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') { rename { "LICENSE_${mod_id}" } }
    from('LICENSE-ZASOBY.txt') { rename { "LICENSE-ZASOBY_${mod_id}.txt" } }
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Paczka do publikacji: gotowy jar (dla Modrinth/CurseForge) i zip dla graczy z instrukcją i licencjami
tasks.register('paczka', Zip) {
    group = 'zwiadowcy'
    description = 'Buduje mod i składa paczkę do publikacji w build/publikacja'
    dependsOn 'build', 'reobfJar'
    def jarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    archiveFileName = "Zwiadowcy-Ruiny-Gorlanu-${mod_version}-forge-${minecraft_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('publikacja')
    from(jarFile)
    from('publikacja/INSTRUKCJA.txt')
    from('LICENSE')
    from('LICENSE-ZASOBY.txt')
    doLast {
        copy {
            from jarFile
            into layout.buildDirectory.dir('publikacja')
        }
        println "Paczka gotowa: ${destinationDirectory.get().asFile}"
    }
}
